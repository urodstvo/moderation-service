name: moderation-service-v3

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - minio
      - adminer
      - auth
      - task
      - webhook
    environment:
      - NGINX_HOST=localhost
    networks:
      - default

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moderation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  adminer:
    image: adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
    ports:
      - "8001:8000"

  task:
    build:
      context: .
      dockerfile: ./apps/task/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
      - temporal
      - auth
      - webhook
    ports:
      - "8000:8000"

  webhook:
    build:
      context: .
      dockerfile: ./apps/webhook/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
    ports:
      - "8002:8000"

  detoxify:
    build:
      context: .
      dockerfile: ./apps/models/detoxify/Dockerfile
    ports:
      - "4001:8000"

  rubert-toxic:
    build:
      context: .
      dockerfile: ./apps/models/rubert-toxic/Dockerfile
    ports:
      - "4002:8000"

  russian-classifier:
    build:
      context: .
      dockerfile: ./apps/models/russian-classifier/Dockerfile
    ports:
      - "4003:8000"

  nsfw-clip:
    build:
      context: .
      dockerfile: ./apps/models/nsfw-clip/Dockerfile
    ports:
      - "4004:8000"

  nsfw-falconsai:
    build:
      context: .
      dockerfile: ./apps/models/nsfw-falconsai/Dockerfile
    ports:
      - "4005:8000"

  text-worker:
    build:
      context: .
      dockerfile: ./apps/workers/text/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
      - temporal
      - detoxify
      - rubert-toxic
      - russian-classifier

  image-worker:
    build:
      context: .
      dockerfile: ./apps/workers/image/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
      - temporal
      - nsfw-clip
      - nsfw-falconsai

  audio-worker:
    build:
      context: .
      dockerfile: ./apps/workers/audio/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
      - temporal

  video-worker:
    build:
      context: .
      dockerfile: ./apps/workers/video/Dockerfile
    env_file: [.env.docker]
    depends_on:
      - postgres
      - minio
      - temporal
      - nsfw-clip
      - nsfw-falconsai

  temporal:
    image: temporalio/auto-setup:1.20.0
    depends_on:
      - postgres
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/temporal.yaml
    volumes:
      - ./configs/temporal:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.21.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "7234:8080"

  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # grafana:
  #   image: grafana/grafana:9.0.0
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=your_password

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    driver: bridge
