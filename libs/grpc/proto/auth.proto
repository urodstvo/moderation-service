syntax = "proto3";

option go_package = "github.com/urodstvo/moderation-service/libs/grpc/proto";
package proto;

service AuthService {
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse); 
}

message GetUserSettingsRequest {
  int32 userId = 1;
}

message GetUserSettingsResponse {
  int32 userId = 1;
  string ToxicityClassificationModelName = 2;
  string NsfwClassificationModelName = 3;
}
